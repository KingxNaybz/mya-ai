<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mya — Future Interface (Phase 1 Preview)</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- Phase 1 visual prototype, built alongside the existing Command Center
     at /command-center/ -- that interface is unmodified and remains the
     production experience. This page exists purely for visual-development
     safety and review. -->
<div class="dev-badge">Phase 1 Preview — Not Production</div>

<!-- Same behavior as the existing dashboard's login overlay: visible by
     default, hidden only after a real session is confirmed against the
     same /api/command-center-settings endpoint. No separate password, no
     separate session, no client-side-only auth. -->
<div class="mf-login-overlay" id="mf-login-overlay">
  <form class="mf-login-box" id="mf-login-form">
    <div class="mf-logo">MYA</div>
    <p>Enter the dashboard password to continue.</p>
    <input type="password" id="mf-login-password" autocomplete="current-password" required>
    <button type="submit">Unlock</button>
    <p class="mf-login-error" id="mf-login-error" hidden></p>
  </form>
</div>

<div class="mf-shell" id="mf-shell" hidden>

  <div class="mf-topbar">
    <div class="mf-wordmark">MYA</div>
    <div class="mf-topbar-right">
      <a class="mf-back-link" href="/command-center/index.html">Open Command Center</a>
      <button type="button" class="mf-logout-btn" id="mf-logout-btn">Log out</button>
    </div>
  </div>

  <p class="mf-greeting" id="mf-greeting">Hello.</p>

  <div class="mya-core-stage">
    <div class="mya-core" id="mya-core" data-state="idle" role="img" aria-label="Mya's core, currently idle">
      <div class="core-depth-layer layer-back"></div>
      <div class="core-depth-layer layer-mid"></div>
      <svg class="core-svg" viewBox="0 0 480 480">
        <defs>
          <radialGradient id="coreCenterGrad" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="var(--core-center-hi)"/>
            <stop offset="55%" stop-color="var(--core-center-mid)"/>
            <stop offset="100%" stop-color="var(--core-center-lo)" stop-opacity="0"/>
          </radialGradient>
        </defs>

        <g class="orbit-group">
          <ellipse class="orbit-path orbit-a" cx="240" cy="240" rx="192" ry="108"/>
          <ellipse class="orbit-path orbit-b" cx="240" cy="240" rx="152" ry="152"/>
          <ellipse class="orbit-path orbit-c" cx="240" cy="240" rx="108" ry="192"/>
        </g>

        <g class="neural-links">
          <line class="link link-1" x1="240" y1="240" x2="118" y2="148"/>
          <line class="link link-2" x1="240" y1="240" x2="362" y2="158"/>
          <line class="link link-3" x1="240" y1="240" x2="372" y2="302"/>
          <line class="link link-4" x1="240" y1="240" x2="148" y2="332"/>
          <line class="link link-5" x1="240" y1="240" x2="240" y2="88"/>
          <line class="link link-6" x1="240" y1="240" x2="240" y2="392"/>
        </g>

        <g class="neural-points">
          <circle class="node node-1" cx="118" cy="148" r="4"/>
          <circle class="node node-2" cx="362" cy="158" r="4"/>
          <circle class="node node-3" cx="372" cy="302" r="4"/>
          <circle class="node node-4" cx="148" cy="332" r="4"/>
          <circle class="node node-5" cx="240" cy="88" r="4"/>
          <circle class="node node-6" cx="240" cy="392" r="4"/>
        </g>

        <g class="particle-field">
          <circle class="particle p-1" cx="190" cy="170" r="1.6"/>
          <circle class="particle p-2" cx="300" cy="185" r="1.3"/>
          <circle class="particle p-3" cx="330" cy="250" r="1.5"/>
          <circle class="particle p-4" cx="290" cy="320" r="1.2"/>
          <circle class="particle p-5" cx="200" cy="315" r="1.4"/>
          <circle class="particle p-6" cx="165" cy="250" r="1.3"/>
          <circle class="particle p-7" cx="240" cy="150" r="1.1"/>
          <circle class="particle p-8" cx="240" cy="335" r="1.1"/>
          <circle class="particle p-9" cx="275" cy="205" r="1.0"/>
          <circle class="particle p-10" cx="205" cy="280" r="1.0"/>
        </g>

        <circle class="core-halo" cx="240" cy="240" r="98"/>
        <circle class="core-center" cx="240" cy="240" r="54" fill="url(#coreCenterGrad)"/>
      </svg>
    </div>
  </div>

  <div class="mf-state-label" id="mf-state-label">idle</div>

  <div class="mf-command-panel">
    <form class="mf-command-bar" id="mf-command-form">
      <input type="text" id="mf-command-input" placeholder="Type a message to Mya…" autocomplete="off">
      <button type="submit" id="mf-command-send">➤</button>
    </form>
    <div class="mf-command-log" id="mf-command-log"></div>
  </div>

  <!-- DEV ONLY: manual preview of the eight states that have no real
       signal wired up yet in this Phase 1 shell (listening depends on the
       voice pipeline, ported in a later milestone; the rest depend on
       backend signal work not yet exposed to the client). Nothing here
       represents real Mya activity -- see app.js for how these are kept
       distinct from the real event emissions above. -->
  <div class="mf-dev-states" data-dev="true">
    <div class="mf-dev-states-label">Dev preview only — not real activity</div>
    <div class="mf-dev-states-row" id="mf-dev-states-row"></div>
  </div>

</div>

<script src="mya-events.js"></script>
<script src="app.js"></script>
</body>
</html>
